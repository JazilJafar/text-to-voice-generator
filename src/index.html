<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafting vocals media</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
    }

    .container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background-image: linear-gradient(186deg, white, rgb(98, 155, 216), pink);
      padding: 20px;
    }

    .container h1 {
      font-size: 42px;
      font-weight: bolder;
      margin-bottom: 30px;
      color: rgb(81, 79, 79);
      text-align: center;
    }

    textarea {
      width: 100%;
      max-width: 550px;
      min-height: 140px;
      background-color: rgb(251, 243, 243);
      border: 0;
      outline: 0;
      font-size: 16px;
      color: rgb(102, 100, 100);
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 11px;
      resize: none;
    }

    .row {
      width: 100%;
      max-width: 550px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    select {
      flex: 1;
      height: 50px;
      padding: 0 15px;
      color: white;
      background-color: rgb(112, 111, 111);
      border: 0;
      outline: 0;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
    }

    .row button {
      background-color: orange;
      font-size: 18px;
      font-weight: bold;
      padding: 12px 24px;
      color: black;
      border-radius: 25px;
      border: 0;
      outline: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .row button:hover {
      background-color: darkorange;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Text to Speech Converter</h1>
    <textarea id="textarea" placeholder="Please write anything here to convert to vocals"></textarea>
    <div class="row">
      <select id="menuselect"></select>
      <button id="btnconvert">Convert</button>
    </div>
  </div>

  <script>
    const voiceSelect = document.querySelector("#menuselect");
    const textArea = document.querySelector("#textarea");
    const convertBtn = document.querySelector("#btnconvert");

    let voices = [];

    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = "";
      voices.forEach((voice, i) => {
        voiceSelect.options[i] = new Option(voice.name, i);
      });
    }

    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    convertBtn.addEventListener("click", () => {
      const text = textArea.value.trim();
      if (!text) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      if (voices[voiceSelect.value]) {
        utterance.voice = voices[voiceSelect.value];
      }
      window.speechSynthesis.speak(utterance);
    });
  </script>
</body>
</html>
