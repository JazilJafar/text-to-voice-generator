<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crafting vocals media</title><style>*{padding: 0; margin: 0; box-sizing: border-box;}body{height: 100vh;}.container{min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; background-image: linear-gradient(186deg,white,rgb(98, 155, 216),pink);}.container h1{font-size: 46px; font-weight: bolder; margin-top: 40px; margin-bottom: 120px; color: rgb(81, 79, 79);}textarea{width: 550px; height: auto; background-color: rgb(251, 243, 243); min-height: 120px; border: 0; outline: 0; font-size: 16px; color: rgb(102, 100, 100); margin-bottom: 120px; padding: 20px; border-radius: 11px; resize: none;}textarea::-moz-focus-inner{background-color: rgb(149, 172, 172);}.row{width: 630px; display: flex; align-items: center; gap: 40px; margin-top: -10%;}.row button{background-color: orange; font-size: 20px; padding: 10px 20px; color: black; border-radius: 13px; border: 0; outline: 0; cursor: pointer; display: flex; align-items: center; margin-top: 13%;}select{margin-top: 13%; color: white; background-color: rgb(112, 111, 111); height: 50px; padding: 0px 20px; flex: 1; outline: 0; border: 0; border-radius: 40px; margin-left: 9%; appearance: none; background-image: url(./images/dropdown.png); background-repeat: no-repeat; background-size: 15px; background-position-x: calc(100% - 20px); background-position-y: 20px;}</style></head><body><div class="container"><h1>Text to speech Converter</h1><textarea name="texts" id="textarea" placeholder="please write anything here to convert to vocals"></textarea><div class="row"><select name="select" id="menuselect"></select><button id="btnconvert">Convert</button></div></div><script>let speech = new SpeechSynthesisUtterance();let btnn = document.querySelector("button");let voices = [];let voiceslect = document.querySelector("select");window.speechSynthesis.onvoiceschanged = () =>{ voices = window.speechSynthesis.getVoices(); speech.voice = voices[0]; voices.forEach((voice, i) => (voiceslect.options[i] = new Option(voice.name, i)) ) };voiceslect.addEventListener("change",() =>{ speech.voice = voices[voiceslect.value]; });document.querySelector("button").addEventListener("click",()=>{ speech.text = document.querySelector("textarea").value; window.speechSynthesis.speak(speech); })</script></body></html>
